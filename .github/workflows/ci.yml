name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un run nuevo cancela el anterior de la misma rama/PR (nunca los de main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Mínimo privilegio: los jobs solo leen el repositorio.
permissions:
  contents: read

jobs:
  quality:
    name: Quality (format, types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test --watch=false

      - name: Build
        run: pnpm build

  integration:
    name: Database (RLS and triggers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Aplica supabase/migrations y supabase/seed.sql sobre una base nueva.
      # Se omiten los servicios que los tests (conexión directa a Postgres) no usan.
      # public.ecr.aws limita las descargas anónimas ("toomanyrequests") y un arranque
      # fallido puede dejar contenedores a medias ocupando el puerto 54322: se reintenta
      # hasta 3 veces limpiando entre intentos. Si falla las 3 veces, el job falla.
      - name: Start local Supabase
        run: |
          for attempt in 1 2 3; do
            if supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,mailpit,postgres-meta; then
              exit 0
            fi
            echo "::warning::supabase start falló (intento $attempt de 3); se limpia y se reintenta"
            supabase stop --no-backup || true
            docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f
            docker network rm supabase_network_macanix-web 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::supabase start falló 3 veces"
          exit 1

      - name: Integration tests
        run: pnpm test:integration --watch=false

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
