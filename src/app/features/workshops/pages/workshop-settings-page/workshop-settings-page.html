<div class="max-w-2xl mx-auto flex flex-col gap-6">
  <div>
    <a routerLink="/dashboard" class="text-sm text-primary-600 hover:underline">
      ← Volver al dashboard
    </a>
    <h1 class="text-2xl font-bold text-fg mt-2">Configuración del taller</h1>
    <p class="text-sm text-fg-muted mt-1">Datos de tu taller y reglas con las que trabaja.</p>
  </div>

  @if (error(); as message) {
    <p
      role="alert"
      class="rounded-md border border-danger-100 bg-danger-50 px-3 py-2 text-sm text-danger-700"
    >
      {{ message }}
    </p>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
    <app-card padding="lg">
      <h2 class="text-lg font-semibold text-fg mb-4">Datos del taller</h2>

      <div class="mb-6">
        <app-logo-picker
          [currentUrl]="workshops.active()?.logoUrl ?? null"
          (changed)="logo.set($event)"
        />
      </div>

      <div class="flex flex-col gap-4">
        <app-input
          label="Nombre del taller"
          [required]="true"
          formControlName="name"
          [error]="fieldError('name')"
        />
        <app-input
          label="Dirección"
          autocomplete="street-address"
          [required]="true"
          formControlName="address"
          [error]="fieldError('address')"
        />
        <app-input
          type="tel"
          label="Teléfono"
          autocomplete="tel"
          [required]="true"
          formControlName="phone"
          [error]="fieldError('phone')"
        />
      </div>
    </app-card>

    <app-card padding="lg">
      <h2 class="text-lg font-semibold text-fg mb-4">Reglas del taller</h2>

      <div class="grid gap-4 sm:grid-cols-2">
        <app-input
          type="number"
          label="Capacidad (vehículos a la vez)"
          [required]="true"
          formControlName="capacity"
          [error]="fieldError('capacity')"
        />
        <app-input
          type="number"
          label="Fotos mínimas de ingreso"
          [required]="true"
          formControlName="minIntakePhotos"
          [error]="fieldError('minIntakePhotos')"
        />
        <app-input
          type="number"
          label="Días de validez de la cotización"
          [required]="true"
          formControlName="quoteExpirationDays"
          [error]="fieldError('quoteExpirationDays')"
        />
        <app-input
          type="number"
          label="Días de garantía"
          [required]="true"
          formControlName="warrantyDays"
          [error]="fieldError('warrantyDays')"
        />
        <app-input
          label="Moneda"
          hint="Código de 3 letras, ej. USD"
          [required]="true"
          formControlName="currency"
          [error]="fieldError('currency')"
        />
        <app-input
          label="Zona horaria"
          hint="Ej. America/Guayaquil"
          [required]="true"
          formControlName="timezone"
          [error]="fieldError('timezone')"
        />
      </div>
    </app-card>

    <div class="flex justify-end">
      <app-button type="submit" [loading]="isSaving()">Guardar cambios</app-button>
    </div>
  </form>
</div>
