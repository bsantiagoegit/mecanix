<div class="min-h-screen bg-bg flex flex-col">
  <!-- Header -->
  <header class="bg-surface border-b border-border sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a routerLink="/dashboard" class="flex items-center gap-3" aria-label="Ir al dashboard">
        <span class="text-lg font-semibold text-fg">TallerOS</span>
        @if (workshop.active(); as w) {
          <span class="text-fg-muted">·</span>
          <div
            class="h-8 w-8 shrink-0 rounded-md border border-border bg-bg flex items-center justify-center overflow-hidden"
          >
            @if (logoUrl(); as logo) {
              <img
                [src]="logo"
                [alt]="'Logo de ' + w.name"
                class="h-full w-full object-contain"
                (error)="onLogoError()"
              />
            } @else {
              <span class="text-sm font-semibold text-fg-muted" aria-hidden="true">{{
                initial()
              }}</span>
            }
          </div>
          <span class="text-sm text-fg">{{ w.name }}</span>
        }
      </a>

      <nav class="flex items-center gap-4" aria-label="Principal">
        <a
          routerLink="/dashboard"
          routerLinkActive="text-fg font-semibold"
          ariaCurrentWhenActive="page"
          class="text-sm text-fg-muted hover:text-fg"
          >Dashboard</a
        >
        @if (auth.role() === 'owner') {
          <a
            routerLink="/team"
            routerLinkActive="text-fg font-semibold"
            ariaCurrentWhenActive="page"
            class="text-sm text-fg-muted hover:text-fg"
            >Equipo</a
          >
          <a
            routerLink="/settings"
            routerLinkActive="text-fg font-semibold"
            ariaCurrentWhenActive="page"
            class="text-sm text-fg-muted hover:text-fg"
            >Configuración</a
          >
        }
      </nav>

      <div class="flex items-center gap-3">
        @if (auth.user(); as user) {
          <span class="text-sm text-fg-muted">{{ user.fullName }}</span>
        }
        <button type="button" (click)="logout()" class="text-sm text-fg-muted hover:text-fg">
          Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
    <router-outlet />
  </main>

  <!-- Toasts -->
  <app-toast-container />
</div>
