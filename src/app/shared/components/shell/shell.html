<div class="min-h-screen bg-bg flex flex-col">
  <!-- Header -->
  <header class="bg-surface border-b border-border sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-lg font-semibold text-fg">TallerOS</span>
        @if (workshop.active(); as w) {
          <span class="text-sm text-fg-muted">· {{ w.name }}</span>
        }
      </div>

      <div class="flex items-center gap-3">
        @if (auth.user(); as user) {
          <span class="text-sm text-fg-muted">{{ user.fullName }}</span>
        }
        <button type="button" (click)="logout()" class="text-sm text-fg-muted hover:text-fg">
          Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
    <router-outlet />
  </main>

  <!-- Toasts -->
  <app-toast />
</div>
