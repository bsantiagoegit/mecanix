<button
  [type]="type()"
  [class]="classes()"
  [disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-expanded]="ariaExpanded()"
  [attr.aria-controls]="ariaControls()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <app-icon name="loader-circle" class="animate-spin" />
  }
  <ng-content />
</button>
