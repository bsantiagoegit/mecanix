<button
  #trigger
  type="button"
  class="flex h-5 w-5 items-center justify-center rounded-full text-fg-muted hover:text-fg"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-describedby]="isOpen() ? tooltipId : null"
  [attr.aria-expanded]="isOpen()"
  (mouseenter)="onEnter()"
  (mouseleave)="onLeave()"
  (focus)="onFocus()"
  (blur)="onBlur()"
  (click)="onClick()"
  (keydown)="onKeydown($event)"
>
  <app-icon name="info" />
</button>

@if (isOpen() && position(); as pos) {
  <div
    role="tooltip"
    [id]="tooltipId"
    class="fixed z-[70] rounded-md border border-border bg-surface p-3 text-fg shadow-lg"
    [style.top.px]="pos.top"
    [style.bottom.px]="pos.bottom"
    [style.left.px]="pos.left"
    [style.width.px]="width"
    [style.maxWidth]="'calc(100vw - 1rem)'"
  >
    <ng-content />
  </div>
}
