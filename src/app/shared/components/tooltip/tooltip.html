<button
  #trigger
  type="button"
  class="flex h-5 w-5 items-center justify-center rounded-full text-fg-muted hover:text-fg"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-describedby]="isOpen() ? tooltipId : null"
  [attr.aria-expanded]="isOpen()"
  (mouseenter)="onEnter()"
  (mouseleave)="onLeave()"
  (focus)="onFocus()"
  (blur)="onBlur()"
  (click)="onClick()"
  (keydown)="onKeydown($event)"
>
  <svg
    class="h-4 w-4"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    viewBox="0 0 24 24"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="9" />
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 11v5M12 8h.01" />
  </svg>
</button>

@if (isOpen() && position(); as pos) {
  <div
    role="tooltip"
    [id]="tooltipId"
    class="fixed z-[70] rounded-md border border-border bg-surface p-3 text-fg shadow-lg"
    [style.top.px]="pos.top"
    [style.bottom.px]="pos.bottom"
    [style.left.px]="pos.left"
    [style.width.px]="width"
    [style.maxWidth]="'calc(100vw - 1rem)'"
  >
    <ng-content />
  </div>
}
