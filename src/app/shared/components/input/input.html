<div class="flex flex-col gap-1">
  @if (label()) {
    <label [for]="inputId" class="text-sm font-medium text-fg">
      {{ label() }}
      @if (required()) {
        <span class="text-danger-500">*</span>
      }
    </label>
  }

  <div class="relative">
    <input
      [id]="inputId"
      [type]="inputType()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="error() ? inputId + '-error' : null"
      [class]="inputClasses()"
      (input)="onInput($event)"
      (blur)="onTouched()"
    />

    @if (type() === 'password' && revealable()) {
      <button
        type="button"
        class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded text-fg-muted hover:bg-neutral-100 dark:hover:bg-neutral-800"
        (click)="toggleReveal()"
        [attr.aria-label]="revealed() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        @if (revealed()) {
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
            />
          </svg>
        } @else {
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
            />
          </svg>
        }
      </button>
    }
  </div>

  @if (hint() && !error()) {
    <p class="text-xs text-fg-muted">{{ hint() }}</p>
  }

  @if (error()) {
    <p [id]="inputId + '-error'" class="text-xs text-danger-600" role="alert">
      {{ error() }}
    </p>
  }
</div>
