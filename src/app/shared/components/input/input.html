<div class="flex flex-col gap-1">
  @if (label()) {
    <div class="flex items-center gap-1.5">
      <label [for]="inputId" class="text-sm font-medium text-fg">
        {{ label() }}
        @if (required()) {
          <span class="text-danger-500">*</span>
        }
      </label>
      <ng-content select="[labelHelp]" />
    </div>
  }

  <div class="relative">
    <input
      [id]="inputId"
      [type]="inputType()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [attr.autocomplete]="autocomplete()"
      [attr.maxlength]="maxChars()"
      [attr.inputmode]="inputmode()"
      [attr.aria-invalid]="!!error()"
      [attr.aria-describedby]="error() ? inputId + '-error' : null"
      [class]="inputClasses()"
      (input)="onInput($event)"
      (blur)="onTouched()"
    />

    @if (type() === 'password' && revealable()) {
      <button
        type="button"
        class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded text-fg-muted hover:bg-neutral-100 dark:hover:bg-neutral-800"
        (click)="toggleReveal()"
        [attr.aria-label]="revealed() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        @if (revealed()) {
          <app-icon name="eye-off" [size]="20" />
        } @else {
          <app-icon name="eye" [size]="20" />
        }
      </button>
    }
  </div>

  @if (hint() && !error()) {
    <p class="text-xs text-fg-muted">{{ hint() }}</p>
  }

  @if (error()) {
    <p [id]="inputId + '-error'" class="text-xs text-danger-600" role="alert">
      {{ error() }}
    </p>
  }
</div>
