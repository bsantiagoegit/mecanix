<p class="mb-2 text-xs font-medium text-fg">Tu contraseña debe tener:</p>
<ul class="flex flex-col gap-1">
  @for (item of items(); track item.id) {
    <li
      class="flex items-center gap-2 text-xs"
      [class]="item.met ? 'text-success-700' : 'text-fg-muted'"
    >
      <span aria-hidden="true" class="flex h-4 w-4 shrink-0 items-center justify-center">
        @if (item.met) {
          <svg
            class="h-4 w-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        } @else {
          <span class="h-1.5 w-1.5 rounded-full bg-current"></span>
        }
      </span>
      <span>{{ item.label }}</span>
      <span class="sr-only">{{ item.met ? '(cumplida)' : '(pendiente)' }}</span>
    </li>
  }
</ul>
