<dialog
  #dialog
  [class]="classes()"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  (close)="onNativeClose()"
  (cancel)="onCancel($event)"
>
  <div class="flex max-h-[calc(100dvh-2rem)] flex-col">
    <header class="flex items-start justify-between gap-4 border-b border-border px-6 py-4">
      <h2 [id]="titleId" class="text-lg font-semibold text-fg">{{ title() }}</h2>
      @if (closable()) {
        <button
          type="button"
          class="-mr-2 flex h-8 w-8 shrink-0 items-center justify-center rounded text-fg-muted hover:bg-neutral-100 dark:hover:bg-neutral-800"
          aria-label="Cerrar"
          (click)="requestClose()"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      }
    </header>

    <div class="overflow-y-auto px-6 py-4">
      <ng-content />
    </div>

    <footer class="flex justify-end gap-3 border-t border-border px-6 py-4 empty:hidden">
      <ng-content select="[actions]" />
    </footer>
  </div>
</dialog>
